{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>greatrthan.com</title>
    <link rel="stylesheet" href="{% static 'bootstrap-5.3.8-dist/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'styles.css' %}" />
</head>

<body>
    <div class="container">
        <div class="row align-items-center pt-3" style="height: 75px;">
            <div class="col-10">
                <a href="/" class="text-decoration-none text-reset">
                    <h1>> greatrthan</h1>
                </a>
            </div>
            <div class="col-2 text-end">
                <nav class="navbar navbar-dark">
                    <div class="container">
                        <!-- Right-aligned dropdown -->
                        <div class="dropdown ms-auto">
                            <!-- Hamburger button (no dropdown arrow class) -->
                            <button class="btn btn-dark" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <!-- Bootstrap hamburger icon -->
                                <span class="navbar-toggler-icon"></span>
                            </button>
                            <!-- Dropdown menu -->
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <form method="post" action="{% url 'new_session' %}">
                                        {% csrf_token %}
                                        <button type="submit" class="dropdown-item">New session</button>
                                    </form>
                                </li>
                                <li><a class="dropdown-item" href="/about">About</a></li>
                            </ul>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </div>
    <hr>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
<script src="{% static 'bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'htmx.min.js' %}"></script>

</html>
